name: Umbra Night Shift
# Autonomous engineering in CI: review every PR, and run a nightly scan that
# opens branch-only fix PRs. Codex does the engineering, GPT-5.6 the reasoning.
# Drop this into any repo and add an OPENAI_API_KEY secret.
on:
  pull_request:
  schedule:
    - cron: "17 3 * * *"   # 03:17 nightly — the night shift
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  umbra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Honest gate: the Codex action can't authenticate without OPENAI_API_KEY.
      # When the secret is absent (e.g. forks, or a repo that hasn't set it), skip
      # cleanly instead of failing red on every scheduled run — the night shift is
      # opt-in and its absence is not an error.
      - name: Check for OPENAI_API_KEY
        id: gate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Umbra Night Shift skipped::OPENAI_API_KEY is not set; the night shift is opt-in. Add the secret to enable Codex review/fixes."
          fi

      # Mode A (pull_request) → read-only review. Mode B (nightly/manual) →
      # Codex may edit the checkout; a later step opens the PR.
      - name: Run Umbra (Codex · GPT-5.6)
        id: umbra
        if: ${{ steps.gate.outputs.enabled == 'true' }}
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          model: gpt-5.6-sol
          prompt-file: .umbra/nightshift.md
          permission-profile: ${{ github.event_name == 'pull_request' && ':read-only' || ':workspace' }}

      # Mode A: post Umbra's review as a single PR comment (never approves/blocks).
      - name: Post PR review comment
        if: ${{ steps.gate.outputs.enabled == 'true' && github.event_name == 'pull_request' && steps.umbra.outputs['final-message'] != '' }}
        uses: actions/github-script@v7
        env:
          UMBRA_REVIEW: ${{ steps.umbra.outputs['final-message'] }}
        with:
          script: |
            const body = process.env.UMBRA_REVIEW || "";
            if (!body.trim()) return;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      # Mode B: if Umbra edited the workspace, open a branch-only PR (never merges).
      - name: Open fix PR
        if: ${{ steps.gate.outputs.enabled == 'true' && github.event_name != 'pull_request' }}
        uses: peter-evans/create-pull-request@v6
        with:
          branch: umbra/nightly
          delete-branch: true
          title: "🌑 Umbra night shift — automated fixes"
          body: ${{ steps.umbra.outputs['final-message'] }}
          labels: umbra
