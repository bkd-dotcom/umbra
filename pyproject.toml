[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "umbra-engineer"
version = "0.1.0"
description = "The AI engineer that works the night shift."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Binay Dalai" }]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "openai>=1.0.0",
  "PyGithub>=2.3.0",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "authlib>=1.3.0",
  "itsdangerous>=2.1.0",
  "cryptography>=42.0.0",
  # Verifies Google-issued OIDC tokens from Cloud Scheduler (issuer/audience/
  # signature/expiry) against Google's public certs — the official library, not a
  # hand-rolled JWT check. Already present transitively via google-cloud-firestore
  # in the deployed image; declared here so scheduler auth works in every install.
  "google-auth>=2.30.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]
# Durable per-user storage in the cloud; the app falls back to in-memory
# without it, so this is only installed in the deployed image (Dockerfile).
cloud = ["google-cloud-firestore>=2.16.0"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

